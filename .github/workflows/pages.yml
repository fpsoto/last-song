name: Deploy to GitHub Pages

# Checks that every script parses, then publishes the static site.
# Runs on every push to main, and can be started by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push cancels the one still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Node is only a development tool here: the game itself needs no build and no dependencies.
      - name: Check JavaScript syntax
        run: |
          for f in js/*.js; do
            echo "checking $f"
            node --check "$f"
          done

  deploy:
    name: Deploy
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
