name: Release

# A release is a branch: cut release/X.Y.Z from develop, open a PR into main, merge it.
# Merging is the whole release: the branch name is the single source of the version, and
# the vX.Y.Z tag and the GitHub Release are created here, never by hand. The same merge
# into main also triggers the Pages deploy (pages.yml).
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write       # create the tag and the GitHub Release
  pull-requests: write  # open the back-merge PR into develop

jobs:
  release:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.event.pull_request.head.ref }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Resolve and validate the version
        id: version
        run: |
          version="${BRANCH#release/}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release branches must be named release/X.Y.Z (got '$BRANCH')."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released (tag v$version exists). Bump the version."
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Create the GitHub Release and its tag
        env:
          VERSION: ${{ steps.version.outputs.value }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 0.x releases are pre-production (see CLAUDE.md "Versions and releases").
          prerelease=""; [[ "$VERSION" == 0.* ]] && prerelease="--prerelease"
          gh release create "v$VERSION" --target "$MERGE_SHA" --title "v$VERSION" --generate-notes $prerelease \
            --notes "Released from \`$BRANCH\` (PR #${{ github.event.pull_request.number }}). Play it at https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      # main now has the release merge (and any fixes made on the release branch); bring them
      # back so develop carries the tag in its history. Never fails the release: a repo
      # setting can forbid Actions from opening PRs.
      - name: Open the back-merge PR into develop
        env:
          VERSION: ${{ steps.version.outputs.value }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --base develop --head main \
            --title "Back-merge release v$VERSION into develop" \
            --body "Brings the v$VERSION release merge from \`main\` back into \`develop\`. Merge with **Create a merge commit**." \
            || echo "::warning::Couldn't open the back-merge PR; open main -> develop by hand."
