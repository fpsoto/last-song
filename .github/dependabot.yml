# The workflows use pinned action versions, which only stay safe if someone bumps them.
# Dependabot opens the PRs against develop, like every other change (see CLAUDE.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    labels: [chore, "area: infra"]
    groups:
      actions:
        patterns: ["*"]
