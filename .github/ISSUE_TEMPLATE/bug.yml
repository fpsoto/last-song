name: Bug
description: Something behaves differently from what it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The observed behavior, with console errors or screenshots.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A URL with dev flags (for example ?start=1&skip=4) makes this much easier.
      value: |
        1.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and version, desktop or touch device, game URL or commit.
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Suspected cause, workaround, related issues (optional).
